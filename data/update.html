<!DOCTYPE html>
<html lang="de">
<head>
    <title>ESP32 OTA Update</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light p-4">
    <div class="container" style="max-width: 600px; margin-top: 10% !important;">
        <div class="card bg-secondary text-white p-4 shadow">
            <h3 class="mb-3"><i class="bi bi-cpu-fill text-warning"></i> Firmware OTA Update</h3>
            <p class="text-light-50">Lade hier die neu kompilierte <code class="text-warning">firmware.bin</code> hoch, um das MacroPad kabellos zu aktualisieren.</p>
            <hr>
            
            <form method="POST" action="/update" enctype="multipart/form-data" id="upload-form">
                <div class="mb-3">
                    <label class="form-label small">Firmware-Datei (.bin) auswählen</label>
                    <input type="file" name="update" class="form-control bg-dark text-white border-0" accept=".bin" required id="file-input">
                </div>
                
                <div class="progress mb-3 d-none" id="progress-container">
                    <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width: 0%">0%</div>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a href="/" class="btn btn-outline-light">Abbrechen</a>
                    <button type="submit" class="btn btn-warning fw-bold" id="submit-btn"><i class="bi bi-lightning-fill"></i> Update starten</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/update.js"></script>
</body>
</html>
