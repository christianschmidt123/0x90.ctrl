<!DOCTYPE html>
<html lang="de">
<head>
    <title>ESP32 OTA Update</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        #drop-zone {
            border: 2px dashed #6c757d;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        #drop-zone.drag-over {
            border-color: #ffc107;
            background: rgba(255, 193, 7, 0.08);
        }
        #drop-zone.file-ready {
            border-color: #28a745;
            background: rgba(40, 167, 69, 0.08);
        }
    </style>
</head>
<body class="bg-dark text-light p-4">
    <div class="container" style="max-width: 600px; margin-top: 8% !important;">
        <div class="card bg-secondary text-white p-4 shadow">
            <h3 class="mb-3"><i class="bi bi-cpu-fill text-warning"></i> OTA Update</h3>

            <!-- Modus-Auswahl: Firmware oder Dateisystem -->
            <ul class="nav nav-pills mb-3" id="update-tabs">
                <li class="nav-item">
                    <button class="nav-link active" id="tab-fw" onclick="setMode('fw')">
                        <i class="bi bi-lightning-fill"></i> Firmware
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="tab-fs" onclick="setMode('fs')">
                        <i class="bi bi-folder2-open"></i> Dateisystem
                    </button>
                </li>
            </ul>

            <p class="text-light-50 small mb-3" id="mode-hint">
                Flasht die Firmware (<code class="text-warning">firmware.bin</code>).
                PlatformIO-Target: <code>upload</code>
            </p>
            <hr>

            <!-- Drag-and-Drop-Zone -->
            <div id="drop-zone" onclick="document.getElementById('file-input').click()">
                <i class="bi bi-cloud-arrow-up fs-1 text-secondary" id="drop-icon"></i>
                <p class="mt-2 mb-0" id="drop-label">Datei hier ablegen oder <span class="text-warning">klicken</span></p>
                <small class="text-muted">.bin-Datei</small>
            </div>

            <input type="file" id="file-input" accept=".bin" class="d-none">

            <div class="progress mt-3 d-none" id="progress-container">
                <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                     role="progressbar" style="width: 0%">0%</div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-3">
                <a href="/" class="btn btn-outline-light">Abbrechen</a>
                <button class="btn btn-warning fw-bold" id="submit-btn" disabled>
                    <i class="bi bi-lightning-fill"></i> Update starten
                </button>
            </div>
        </div>
    </div>

    <script src="/js/update.js"></script>
</body>
</html>
