<!DOCTYPE html>
<html lang="de">
<head>
    <title>0x90.deck - Web IDE</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/ide.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/ace.js"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 sidebar p-4">
                <h4 class="text-info mb-4"><i class="bi bi-folder2-open"></i> 0x90.FS</h4>
                <div id="file-list" class="list-group list-group-flush">
                    <div class="text-muted">Lade Dateien...</div>
                </div>
                <hr class="my-4">
                <button class="btn btn-success w-100 mb-2" onclick="saveFile()"><i class="bi bi-floppy"></i> Speichern</button>
                <a href="/" class="btn btn-outline-secondary w-100"><i class="bi bi-arrow-left"></i> Dashboard</a>
            </div>
            <div class="col-md-9 p-4">
                <h3 id="current-file-title" class="mb-3 text-secondary">Keine Datei ausgewählt</h3>
                <div id="editor"></div>
            </div>
        </div>
    </div>

    <script src="/ide.js"></script>
</body>
</html>
