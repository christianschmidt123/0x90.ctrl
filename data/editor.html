<!DOCTYPE html>
<html lang="de">
<head>
    <title>Macro Editor</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/editor.css">
</head>
<body class="bg-dark text-light p-4">
    <div class="container" style="max-width: 1100px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h3><i class="bi bi-sliders"></i> Multi-Hotkey Konfigurator</h3>
                <p class="text-muted mb-0">Konfiguriere Tastenbelegungen, Hotkeys oder Freitexte komplett visuell.</p>
            </div>
            <div>
                <button class="btn btn-success fw-bold" onclick="saveConfig()"><i class="bi bi-floppy"></i> Speichern</button>
                <a href="/" class="btn btn-outline-secondary ms-2">Zurück</a>
            </div>
        </div>
        
        <div id="macro-list" class="mb-4">Lade Konfiguration...</div>
    </div>

    <div class="modal fade" id="iconModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-secondary text-white">
                <div class="modal-header border-0">
                    <h5 class="modal-title"><i class="bi bi-grid-3x3-gap"></i> Icon auswählen</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Schließen"></button>
                </div>
                <div class="modal-body bg-dark">
                    <div class="row row-cols-6 g-3 text-center" id="icon-picker-grid">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/editor.js"></script>
</body>
</html>
